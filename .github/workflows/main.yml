name: Build Sunil Gujarati Gujlish Keyboard APK

"on":
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Find and extract Android source ZIP
    run: |
      ZIP_FILE=$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)
      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: Android source ZIP not found"
        exit 1
      fi
      mkdir -p source
      unzip -o "$ZIP_FILE" -d source

  - name: Build APK
    run: |
      GRADLE_FILE=$(find source -type f -name gradlew | head -n 1)
      if [ -z "$GRADLE_FILE" ]; then
        echo "ERROR: gradlew not found inside ZIP"
        exit 1
      fi
      PROJECT_DIR=$(dirname "$GRADLE_FILE")
      cd "$PROJECT_DIR"
      chmod +x gradlew
      echo "sdk.dir=$ANDROID_HOME" > local.properties
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Sunil-Gujlish-Keyboard-APK
      path: source/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
